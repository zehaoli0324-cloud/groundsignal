<h1>这个时间点，系统知道什么？</h1>
<p class="intro">检查证据来源、独立性和审核状态，回放一条商业主张如何被支持、确认或修正。</p>
<div class="notice" id="notice" role="status"></div>
<div class="controls">
<div class="field wide"><label for="dataset">选择数据</label><select id="dataset"></select></div>
<div class="field"><label for="asof">截止时间（UTC）</label><input type="datetime-local" id="asof" step="1"></div>
<button class="primary" id="apply">查看当时结果</button>
</div>
<div id="asof-note" aria-live="polite"></div><div class="presets" id="presets"></div>
<section class="metrics" aria-label="当前快照指标">
<div class="metric"><div class="label">可见事件</div><div class="value" id="event-count">0</div><small>只计截止时刻可用的记录</small></div>
<div class="metric"><div class="label">已确认事件</div><div class="value" id="verified-count">0</div><small>需要核对一手支持原文</small></div>
<div class="metric"><div class="label">独立支持来源</div><div class="value" id="independent-count">0</div><small>转载与相同内容合并计数</small></div>
<div class="metric"><div class="label" id="lead-label">提前量可计算事件</div><div class="value" id="lead-count">0</div><small id="lead-note">缺少时间依据时不计算</small></div>
</section>
<div class="workspace">
<section class="panel"><div class="panel-head"><h2>事件与候选主张</h2><small id="list-count"></small></div><div class="event-list" id="events"></div></section>
<section class="panel"><div class="panel-head"><h2>证据与时间线</h2><div class="exports"><button class="export" id="json">快照 JSON</button><button class="export" id="jsonl">事件 JSONL</button><button class="export" id="csv">事件 CSV</button></div></div><div class="detail" id="detail"></div></section>
</div>

function render(){const m=view.metrics;$('event-count').textContent=m.visible_events;$('verified-count').textContent=m.states.VERIFIED||0;$('independent-count').textContent=m.independent_supports;$('lead-count').textContent=m.lead_time_measured_events;$('list-count').textContent=view.events.length+' 条';$('events').replaceChildren();for(const e of view.events){const b=node('button',undefined,'event-button'+(e.event_id===selected?' selected':''));b.append(badge(e.status),node('div',e.title,'name'),node('small',e.evidence_count+' 条记录 · '+e.independent_sources+' 个独立支持来源'));b.onclick=()=>{selected=e.event_id;render();};$('events').append(b);}if(!view.events.length)$('events').append(node('div','当时没有可用证据。','empty'));renderDetail();}
function fact(list,label,value){const wrap=node('div',undefined,'fact');wrap.append(node('dt',label),node('dd',value));list.append(wrap);}
function renderDetail(){const d=$('detail');d.replaceChildren();const e=view.events.find(x=>x.event_id===selected);if(!e){d.append(node('div','选择更晚的时间或其他数据，查看当时已经可用的记录。','empty'));return;}d.append(badge(e.status),node('h2',e.title),node('div',e.status_reason,'muted'));const facts=node('dl',undefined,'facts');fact(facts,'事件类型 / 产品',e.event_type+' / '+(e.product||'未提供'));fact(facts,'事件发生时间（保留原精度）',e.event_time||'未知');fact(facts,'首次支持时间',time(e.first_supported_at));fact(facts,'公开确认时间',time(e.public_confirmation_at));fact(facts,view.mode==='synthetic'?'模拟提前量':'提前量',e.lead_time_days===null?'不计算':e.lead_time_days+' 天');fact(facts,'计算边界',e.lead_time_note);if(e.superseded_by)fact(facts,'替代记录',e.superseded_by+' · '+time(e.superseded_at));d.append(facts,node('div','当时可见的证据（'+e.evidence_count+' 条）','timeline-title'));for(const item of e.evidence){const card=node('article',undefined,'evidence');const top=node('div',undefined,'evidence-top');top.append(node('strong',item.id),node('time',time(item.processed_at)));card.append(top,node('div',item.review?'审核：'+item.review.decision+' · '+item.review.reason:'尚未审核','muted'),node('blockquote',item.content_excerpt));card.append(node('div','来源组：'+(item.review?.independence_group||'未确认')+' · 原始来源核对：'+(item.original_source_checked?'已声明核对':'未完成'),'muted'));if(view.mode==='synthetic')card.append(node('div','虚构来源地址，仅用于测试','muted'));else card.append(link(item.source_url,'打开保存记录的来源'));if(item.cited_source_url){card.append(node('span',' · '),link(item.cited_source_url,'原笔记引用的网址（未重新读取）'));}const details=node('details');details.append(node('summary','查看时间、指纹与完整来源记录'),node('pre',JSON.stringify(item,null,2)));card.append(details);d.append(card);}}
function rows(){return view.events.map(e=>({event_id:e.event_id,title:e.title,event_type:e.event_type,product:e.product,event_time:e.event_time,status:e.status,evidence_count:e.evidence_count,independent_sources:e.independent_sources,first_supported_at:e.first_supported_at,public_confirmation_at:e.public_confirmation_at,lead_time_days:e.lead_time_days,lead_time_note:e.lead_time_note,last_verified_at:e.last_verified_at,superseded_at:e.superseded_at,superseded_by:e.superseded_by,schema_version:'groundsignal.event-feed.v1',entity_ids:e.entity_ids,as_of:view.as_of,mode:view.mode,evidence_ids:e.evidence.map(x=>x.id),source_urls:e.evidence.map(x=>x.source_url)}));}
function download(name,text,mime){const url=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('json').onclick=()=>download('groundsignal-snapshot.json',JSON.stringify(view,null,2),'application/json');
$('jsonl').onclick=()=>download('groundsignal-events.jsonl',rows().map(r=>JSON.stringify(r)+'\n').join(''),'application/x-ndjson');
$('csv').onclick=()=>{const r=rows(),keys=r.length?Object.keys(r[0]):['event_id','status','as_of','mode'];const cell=v=>{let s=Array.isArray(v)?JSON.stringify(v):v===null||v===undefined?'':String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};download('groundsignal-events.csv','\ufeff'+[keys.map(cell).join(','),...r.map(x=>keys.map(k=>cell(x[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8');};
bundle.datasets.forEach((d,i)=>{const o=node('option',d.title);o.value=i;$('dataset').append(o);});$('dataset').onchange=()=>setDataset(Number($('dataset').value));$('apply').onclick=()=>choose($('asof').value+'Z');setDataset(0);
</script>
</body>
</html>
