<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GroundSignal · 证据与时间回放 Demo</title>
<style>
:root{color-scheme:light;--ink:#18342d;--muted:#697872;--line:#dce4df;--green:#14664b;--bg:#f4f6f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #54a386;outline-offset:3px}.shell{max-width:1320px;margin:auto;padding:34px 34px 24px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:23px}.brand{font-size:21px;font-weight:760;letter-spacing:-.6px}.brand span{color:var(--green)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:6px}.tag{border:1px solid #bccfc1;border-radius:20px;padding:5px 13px;color:var(--green);font-size:12px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 6px;line-height:1.3}.intro{color:var(--muted);margin:0 0 18px}.notice{padding:12px 16px;border:1px solid #e4d7ac;background:#fff9e7;border-radius:9px;color:#756029;margin-bottom:20px}.controls{display:flex;align-items:end;gap:14px;flex-wrap:wrap;background:white;padding:18px;border:1px solid var(--line);border-radius:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:200px}.field.wide{flex:1;min-width:280px}label{font-size:12px;font-weight:650;color:var(--muted)}select,input{width:100%;min-height:42px;background:#fff;border:1px solid #c9d6ce;border-radius:7px;padding:8px 11px;color:var(--ink)}.primary{min-height:42px;border:0;border-radius:7px;padding:9px 17px;background:var(--green);color:white}.presets{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}.preset,.export{border:1px solid var(--line);background:white;border-radius:7px;padding:7px 12px;color:var(--ink);font-size:12px}.preset:hover,.export:hover{background:#e8f2eb}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.metric{padding:17px 20px;border:1px solid var(--line);background:white;border-radius:11px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:28px;font-weight:720;line-height:1.4}.metric small{color:var(--muted)}.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px}.panel{border:1px solid var(--line);background:white;border-radius:12px;overflow:hidden}.panel-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.panel-head h2{font-size:15px;margin:0}.panel-head small{color:var(--muted)}.event-list{padding:9px;max-height:640px;overflow:auto}.event-button{display:block;width:100%;text-align:left;border:1px solid transparent;background:white;border-radius:8px;padding:13px 12px;margin-bottom:5px;color:var(--ink)}.event-button.selected{border-color:#b2d2bf;background:#edf5ee}.event-button .name{font-weight:650;line-height:1.5;margin:7px 0}.event-button small{color:var(--muted)}.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;border-radius:5px;padding:3px 7px;background:#edf0ed;color:#687570}.badge.VERIFIED,.badge.SUPPORTED{background:#dceee2;color:#1a6242}.badge.WATCH{background:#e8eff8;color:#3b618f}.badge.DISPUTED,.badge.REJECTED{background:#f9e6df;color:#9e4c38}.detail{padding:22px}.detail h2{font-size:21px;margin:9px 0 5px;line-height:1.5}.muted{color:var(--muted)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:20px 0}.fact{border-top:1px solid var(--line);padding-top:9px}.fact dt{font-size:11px;color:var(--muted)}.fact dd{margin:4px 0;font-size:13px;overflow-wrap:anywhere}.timeline-title{font-size:13px;font-weight:700;margin:24px 0 14px}.evidence{border:1px solid var(--line);border-left:3px solid #8fb59f;border-radius:8px;padding:14px 16px;margin-bottom:12px}.evidence-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.evidence-top strong{font-size:12px}.evidence time{font-size:11px;color:var(--muted)}blockquote{margin:10px 0;padding:10px 12px;background:#f5f7f3;border-radius:5px;white-space:pre-wrap;font-size:13px}a{color:var(--green);overflow-wrap:anywhere}details{margin-top:9px}summary{color:var(--muted);font-size:12px;cursor:pointer}pre{background:#f4f6f3;padding:12px;border-radius:6px;overflow:auto;max-height:270px;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.exports{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:35px 20px;text-align:center;color:var(--muted)}footer{margin:22px 0 0;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px}.error{color:#a13e2e}#asof-note{margin:10px 0 0;font-size:11px;color:var(--muted)}@media(max-width:850px){.shell{padding:22px 16px}.workspace{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.event-list{max-height:300px}.facts{grid-template-columns:1fr}h1{font-size:24px}header{align-items:start}.field,.field.wide{min-width:100%;flex:1}.controls .primary{width:100%}footer{flex-direction:column;gap:5px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s}}
</style>
</head>
<body>
<main class="shell">
<header><div><div class="eyebrow">ISSUE #1 · MINIMAL WORKING DEMO</div><div class="brand">Ground<span>Signal</span></div></div><span class="tag">证据 · 事件 · 时间回放</span></header>
<h1>这个时间点，系统知道什么？</h1>
<p class="intro">检查证据来源、独立性和审核状态，回放一条商业主张如何被支持、确认或修正。</p>
<div class="notice" id="notice" role="status"></div>
<div class="controls">
<div class="field wide"><label for="dataset">选择数据</label><select id="dataset"></select></div>
<div class="field"><label for="asof">截止时间（UTC）</label><input type="datetime-local" id="asof" step="1"></div>
<button class="primary" id="apply">查看当时结果</button>
</div>
<div id="asof-note" aria-live="polite"></div><div class="presets" id="presets"></div>
<section class="metrics" aria-label="当前快照指标">
<div class="metric"><div class="label">可见事件</div><div class="value" id="event-count">0</div><small>只计截止时刻可用的记录</small></div>
<div class="metric"><div class="label">已确认事件</div><div class="value" id="verified-count">0</div><small>需要核对一手支持原文</small></div>
<div class="metric"><div class="label">独立支持来源</div><div class="value" id="independent-count">0</div><small>转载与相同内容合并计数</small></div>
<div class="metric"><div class="label" id="lead-label">提前量可计算事件</div><div class="value" id="lead-count">0</div><small id="lead-note">缺少时间依据时不计算</small></div>
</section>
<div class="workspace">
<section class="panel"><div class="panel-head"><h2>事件与候选主张</h2><small id="list-count"></small></div><div class="event-list" id="events"></div></section>
<section class="panel"><div class="panel-head"><h2>证据与时间线</h2><div class="exports"><button class="export" id="json">快照 JSON</button><button class="export" id="jsonl">事件 JSONL</button><button class="export" id="csv">事件 CSV</button></div></div><div class="detail" id="detail"></div></section>
</div>
<footer><span>离线展示页 · 不发送任何网络请求 · 导出的快照遵守所选截止时间</span><span>本 Demo 尚未证明实时提前发现、事件覆盖率或商业价值</span></footer>
</main>
<script type="application/json" id="data">__EVIDENCE_DATA__</script>
<script>
'use strict';
const bundle=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const names={EARLY_SIGNAL:'未审核线索',WATCH:'观察',SUPPORTED:'独立证据支持',VERIFIED:'已核对确认',DISPUTED:'存在反证',STALE:'需要复核',SUPERSEDED:'已被替代',REJECTED:'已拒绝'};
let series=bundle.datasets[0], view=null, selected=null;
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function badge(state){return node('span',(names[state]||state)+' · '+state,'badge '+state);}
function time(text){return text?text.replace('T',' ').replace('+00:00',' UTC'):'未知 / 未提供';}
function link(url,label){const a=node('a',label);try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return node('span','无效来源 URL','error');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a;}catch{return node('span','无效来源 URL','error');}}
function choose(at){const cutoff=new Date(at);if(Number.isNaN(cutoff.valueOf())){$('asof-note').textContent='请输入有效时间';return;}const points=series.snapshots.filter(p=>new Date(p.as_of)<=cutoff);const base=points.at(-1);view=base?JSON.parse(JSON.stringify(base)):{schema_version:'groundsignal.event-snapshot.v1',mode:series.mode,title:series.title,entities:[],events:[],metrics:{visible_events:0,states:{},visible_evidence:0,independent_supports:0,lead_time_measured_events:0}};view.as_of=cutoff.toISOString();$('asof').value=cutoff.toISOString().slice(0,19);$('asof-note').textContent='查看截止 '+time(view.as_of)+' 的结果。后续来源和审核不会进入这份快照。';selected=view.events.some(e=>e.event_id===selected)?selected:view.events[0]?.event_id;render();}
function setDataset(index){series=bundle.datasets[index];selected=null;$('notice').textContent=series.mode==='synthetic'?'模拟流程：全部公司、凭证、时间和提前量均为虚构，只验证回放与状态计算。不能作为真实商业信号。':series.mode==='repository_backfill'?'真实仓库记录 · 历史回填：保留原笔记出处，尚未核对原始网页。观察时间取迁移时间，旧年份与置信度不作为历史监测证明。':'采集记录导入：保存搜索或网页线索，主体与商业关系尚待审核。未知发布时间不补填，来源授权状态保留为未知。';$('lead-label').textContent=series.mode==='synthetic'?'模拟提前量可计算事件':'提前量可计算事件';$('lead-note').textContent=series.mode==='synthetic'?'仅为虚构时间线的计算结果':'回填或时间未知时不计算';$('presets').replaceChildren();let presets=series.mode==='synthetic'?[['资格线索','2026-04-03T08:15:00Z'],['两个独立来源','2026-04-10T08:15:00Z'],['新增转载','2026-04-11T08:15:00Z'],['客户确认','2026-05-21T08:15:00Z'],['出现反证','2026-05-25T08:15:00Z'],['反证复核','2026-05-26T08:00:00Z'],['旧版本替代','2026-05-29T08:00:00Z']]:[['入库前',series.snapshots[0].as_of],['入库后',series.default_at]];for(const [label,at]of presets){const b=node('button',label,'preset');b.onclick=()=>choose(at);$('presets').append(b);}choose(series.default_at);}
function render(){const m=view.metrics;$('event-count').textContent=m.visible_events;$('verified-count').textContent=m.states.VERIFIED||0;$('independent-count').textContent=m.independent_supports;$('lead-count').textContent=m.lead_time_measured_events;$('list-count').textContent=view.events.length+' 条';$('events').replaceChildren();for(const e of view.events){const b=node('button',undefined,'event-button'+(e.event_id===selected?' selected':''));b.append(badge(e.status),node('div',e.title,'name'),node('small',e.evidence_count+' 条记录 · '+e.independent_sources+' 个独立支持来源'));b.onclick=()=>{selected=e.event_id;render();};$('events').append(b);}if(!view.events.length)$('events').append(node('div','当时没有可用证据。','empty'));renderDetail();}
function fact(list,label,value){const wrap=node('div',undefined,'fact');wrap.append(node('dt',label),node('dd',value));list.append(wrap);}
function renderDetail(){const d=$('detail');d.replaceChildren();const e=view.events.find(x=>x.event_id===selected);if(!e){d.append(node('div','选择更晚的时间或其他数据，查看当时已经可用的记录。','empty'));return;}d.append(badge(e.status),node('h2',e.title),node('div',e.status_reason,'muted'));const facts=node('dl',undefined,'facts');fact(facts,'事件类型 / 产品',e.event_type+' / '+(e.product||'未提供'));fact(facts,'事件发生时间（保留原精度）',e.event_time||'未知');fact(facts,'首次支持时间',time(e.first_supported_at));fact(facts,'公开确认时间',time(e.public_confirmation_at));fact(facts,view.mode==='synthetic'?'模拟提前量':'提前量',e.lead_time_days===null?'不计算':e.lead_time_days+' 天');fact(facts,'计算边界',e.lead_time_note);if(e.superseded_by)fact(facts,'替代记录',e.superseded_by+' · '+time(e.superseded_at));d.append(facts,node('div','当时可见的证据（'+e.evidence_count+' 条）','timeline-title'));for(const item of e.evidence){const card=node('article',undefined,'evidence');const top=node('div',undefined,'evidence-top');top.append(node('strong',item.id),node('time',time(item.processed_at)));card.append(top,node('div',item.review?'审核：'+item.review.decision+' · '+item.review.reason:'尚未审核','muted'),node('blockquote',item.content_excerpt));card.append(node('div','来源组：'+(item.review?.independence_group||'未确认')+' · 原始来源核对：'+(item.original_source_checked?'已声明核对':'未完成'),'muted'));if(view.mode==='synthetic')card.append(node('div','虚构来源地址，仅用于测试','muted'));else card.append(link(item.source_url,'打开保存记录的来源'));if(item.cited_source_url){card.append(node('span',' · '),link(item.cited_source_url,'原笔记引用的网址（未重新读取）'));}const details=node('details');details.append(node('summary','查看时间、指纹与完整来源记录'),node('pre',JSON.stringify(item,null,2)));card.append(details);d.append(card);}}
function rows(){return view.events.map(e=>({event_id:e.event_id,title:e.title,event_type:e.event_type,product:e.product,event_time:e.event_time,status:e.status,evidence_count:e.evidence_count,independent_sources:e.independent_sources,first_supported_at:e.first_supported_at,public_confirmation_at:e.public_confirmation_at,lead_time_days:e.lead_time_days,lead_time_note:e.lead_time_note,last_verified_at:e.last_verified_at,superseded_at:e.superseded_at,superseded_by:e.superseded_by,schema_version:'groundsignal.event-feed.v1',entity_ids:e.entity_ids,as_of:view.as_of,mode:view.mode,evidence_ids:e.evidence.map(x=>x.id),source_urls:e.evidence.map(x=>x.source_url)}));}
function download(name,text,mime){const url=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('json').onclick=()=>download('groundsignal-snapshot.json',JSON.stringify(view,null,2),'application/json');
$('jsonl').onclick=()=>download('groundsignal-events.jsonl',rows().map(r=>JSON.stringify(r)+'\n').join(''),'application/x-ndjson');
$('csv').onclick=()=>{const r=rows(),keys=r.length?Object.keys(r[0]):['event_id','status','as_of','mode'];const cell=v=>{let s=Array.isArray(v)?JSON.stringify(v):v===null||v===undefined?'':String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};download('groundsignal-events.csv','\ufeff'+[keys.map(cell).join(','),...r.map(x=>keys.map(k=>cell(x[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8');};
bundle.datasets.forEach((d,i)=>{const o=node('option',d.title);o.value=i;$('dataset').append(o);});$('dataset').onchange=()=>setDataset(Number($('dataset').value));$('apply').onclick=()=>choose($('asof').value+'Z');setDataset(0);
</script>
</body>
</html>
